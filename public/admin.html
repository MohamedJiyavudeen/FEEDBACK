<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Admin - Feedback Analytics</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #6dd5ed, #2193b0);
      margin: 0;
      padding: 40px;
      color: #333;
    }
    h1 {
      text-align: center;
      margin-bottom: 20px;
      animation: fadeIn 1s ease-in-out;
    }
    .chart {
      width: 100%;
      height: 300px;
      max-width: 500px;
      max-height: 300px;
      align-items: center;
      margin-left: 30%;
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      animation: slideUp 1s ease;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      animation: fadeIn 1.2s ease;
    }
    th, td {
      border: 1px solid #eee;
      padding: 12px;
      text-align: center;
    }
    th {
      background: #2193b0;
      color: #fff;
    }
    tr:hover {
      background: #f1faff;
      transition: background 0.3s ease;
    }
    #summary {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 20px;
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.08);
      animation: slideUp 1s ease;
    }

    /* 🔒 Modal styles */
    #loginModal {
      display: flex;
      position: fixed;
      z-index: 999;
      left: 0; top: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      text-align: center;
      animation: scaleIn 0.5s ease;
    }
    .modal-content h2 {
      margin-bottom: 20px;
      color: #2193b0;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: all 0.3s ease;
    }
    .modal-content input:focus {
      border-color: #2193b0;
      box-shadow: 0 0 8px rgba(33,147,176,0.4);
    }
    .modal-content button {
      background: #2193b0;
      color: #fff;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .modal-content button:hover {
      background: #6dd5ed;
      color: #000;
      box-shadow: 0 0 15px rgba(109,213,237,0.8);
      transform: scale(1.05);
    }

    /* ✨ Animations */
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(20px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @keyframes slideUp {
      from {opacity: 0; transform: translateY(40px);}
      to {opacity: 1; transform: translateY(0);}
    }
    @keyframes scaleIn {
      from {transform: scale(0.8); opacity: 0;}
      to {transform: scale(1); opacity: 1;}
    }
  </style>
</head>
<body>
  <h1>📊 Admin Dashboard</h1>

 
  <div id="loginModal">
    <div class="modal-content">
      <h2>Admin Login</h2>
      <input id="tokenInput" type="text" placeholder="Enter admin Password"/>
      <button id="loginBtn">Login</button>
      <p id="loginError" style="color:red; margin-top:10px;"></p>
    </div>
  </div>

  <div id="dashboard" style="display:none;">
    <div id="summary"></div>

    <h2>Ratings Distribution</h2>
    <canvas id="distChart" class="chart"></canvas>

    <h2>Recent Feedbacks</h2>
    <table id="feedbackTable">
      <thead>
        <tr>
          <th>Date</th><th>Name</th><th>Email</th><th>Rating</th><th>Message</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="chart.js"></script>
  <script src="admin.js"></script>
</body>
</html>
