<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Feedback Form</title>
  <link rel="stylesheet" href="app.css"/>
</head>
<body>
  <main class="container fade-in">
    <h1 class="slide-down">💬 Send Feedback</h1>
    <form id="feedbackForm" class="form-card bounce-in">
      <label>Name (optional)
        <input type="text" id="name" placeholder="Enter your name" />
      </label>
      <label>Email (optional)
        <input type="email" id="email" placeholder="Enter your email" />
      </label>
      <label>Rating (1-5)
        <select id="rating" required>
          <option value="">Select</option>
          <option>1</option><option>2</option><option>3</option>
          <option>4</option><option>5</option>
        </select>
      </label>
      <label>Message
        <textarea id="message" required minlength="3" placeholder="Write your feedback..."></textarea>
      </label>
      <button type="submit" class="glow-btn">🚀 Submit</button>
      <p id="status"></p>
    </form>
  </main>
  <script src="app.js"></script>
</body>
</html>
